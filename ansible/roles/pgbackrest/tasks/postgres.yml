---
- name: Install pgBackRest on PostgreSQL nodes
  ansible.builtin.apt:
    name: "{{ pgbackrest_package }}"
    state: present
    update_cache: true

- name: Create pgBackRest spool directory
  ansible.builtin.file:
    path: "{{ pgbackrest_spool_path }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

- name: Create PostgreSQL SSH directory
  ansible.builtin.file:
    path: /var/lib/postgresql/.ssh
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Generate PostgreSQL SSH key
  community.crypto.openssh_keypair:
    path: "{{ pgbackrest_ssh_key_path }}"
    type: ed25519
    owner: postgres
    group: postgres
    mode: "0600"
  register: postgres_ssh_key

- name: Authorize this PostgreSQL node on backup host
  ansible.posix.authorized_key:
    user: "{{ pgbackrest_repo_user }}"
    key: "{{ postgres_ssh_key.public_key }}"
    state: present
  delegate_to: backup1

- name: Create pgBackRest configuration directory
  ansible.builtin.file:
    path: /etc/pgbackrest
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

- name: Ensure PostgreSQL known_hosts file exists
  ansible.builtin.file:
    path: /var/lib/postgresql/.ssh/known_hosts
    state: touch
    owner: postgres
    group: postgres
    mode: "0600"

- name: Add backup host to PostgreSQL known_hosts
  ansible.builtin.known_hosts:
    path: /var/lib/postgresql/.ssh/known_hosts
    name: "{{ backup_host }}"
    key: "{{ lookup('pipe', 'ssh-keyscan -H ' ~ backup_host) }}"
    state: present
    hash_host: true

- name: Configure pgBackRest
  ansible.builtin.template:
    src: pgbackrest.conf.j2
    dest: /etc/pgbackrest/pgbackrest.conf
    owner: postgres
    group: postgres
    mode: "0640"