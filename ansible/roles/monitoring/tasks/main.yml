---
- name: Create monitoring directory
  ansible.builtin.file:
    path: "{{ monitoring_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy monitoring project
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../monitoring/"
    dest: "{{ monitoring_dir }}/"
    owner: root
    group: root
    mode: "0644"

- name: Start monitoring stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ monitoring_dir }}"
  register: monitoring_compose
  changed_when: >-
    'Started' in monitoring_compose.stdout or
    'Created' in monitoring_compose.stdout or
    'Recreated' in monitoring_compose.stdout